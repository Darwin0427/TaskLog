name: gestor_tareas
description: "Gestor de tareas, notas y calificaciones"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # UI
  table_calendar: ^3.1.2
  intl: ^0.20.2

  # Notificaciones locales (awesome_notifications reemplaza al plugin
  # anterior — mejor soporte para MIUI/Xiaomi).
  awesome_notifications: ^0.10.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Onboarding de notificaciones (Fase 6): detección de fabricante y
  # deep-links a settings específicas de MIUI/Huawei/Oppo/Vivo/Realme
  # para que el usuario configure autoinicio + batería sin fricción.
  disable_battery_optimization: ^1.1.2
  device_info_plus: ^10.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

# Configuración del ícono del launcher.
# Se aplica corriendo: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  # Apple rechaza íconos con transparencia.
  remove_alpha_ios: true
  # Logo TaskLog: glifo "TL" blanco sobre degradado #8A82F4 → #3A3196.
  # Fuente vectorial: assets/branding/tasklog_glifo.svg
  image_path: "assets/branding/icono_app.png"
  # iOS 18+: variantes para el modo oscuro y el modo tintado de la pantalla
  # de inicio.
  image_path_ios_dark_transparent: "assets/branding/icono_ios_oscuro.png"
  image_path_ios_tinted_grayscale: "assets/branding/icono_ios_tintado.png"
  desaturate_tinted_to_grayscale_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/branding/android_fondo.png"
  adaptive_icon_foreground: "assets/branding/android_primer_plano.png"
