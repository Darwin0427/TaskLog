name: gestor_tareas
description: "Gestor de tareas, notas y calificaciones"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # UI
  table_calendar: ^3.1.2
  intl: ^0.20.2

  # Notificaciones locales (awesome_notifications reemplaza al plugin
  # anterior — mejor soporte para MIUI/Xiaomi).
  awesome_notifications: ^0.10.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Onboarding de notificaciones (Fase 6): detección de fabricante y
  # deep-links a settings específicas de MIUI/Huawei/Oppo/Vivo/Realme
  # para que el usuario configure autoinicio + batería sin fricción.
  disable_battery_optimization: ^1.1.2
  device_info_plus: ^10.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

# Configuración del ícono del launcher.
# Se aplica corriendo: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "LogoTaskLog.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "LogoTaskLog.jpeg"
